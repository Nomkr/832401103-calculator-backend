<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
    :root {
        --bg: #F5F7FB;
        --surface: #FFFFFF;
        --display-bg: #17263D;
        --display-text: #F8FAFC;
        --digit-bg: #FFFFFF;
        --digit-text: #17263D;
        --util-bg: #E6ECF5;
        --util-text: #42526B;
        --op-bg: #2F6BFF;
        --op-text: #FFFFFF;
        --history-bg: #EAF0FA;
        --secondary: #64748B;
    }
    [data-theme="dark"] {
        --bg: #101A2B;
        --surface: #202D42;
        --display-bg: #0A1322;
        --display-text: #F8FAFC;
        --digit-bg: #26364D;
        --digit-text: #F8FAFC;
        --util-bg: #35455D;
        --util-text: #E5ECF5;
        --op-bg: #4B7FFF;
        --op-text: #FFFFFF;
        --history-bg: #1D2A3E;
        --secondary: #A8B7CC;
    }
    * { box-sizing: border-box; }
    body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 24px 16px;
        margin: 0;
        transition: background 0.2s ease;
    }
    .app {
        width: 400px;
        max-width: 100%;
        padding: 16px;
    }
    .header {
        background: var(--surface);
        border-radius: 16px;
        box-shadow: 0 2px 8px rgba(23, 38, 61, 0.06);
        height: 52px;
        display: flex;
        align-items: center;
        padding: 0 10px 0 16px;
        margin-bottom: 10px;
    }
    .header .title {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: var(--op-bg);
        flex: 1;
    }
    .header button {
        border: none;
        border-radius: 14px;
        height: 42px;
        padding: 0 14px;
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
        margin-left: 8px;
        transition: filter 0.12s ease, transform 0.06s ease;
    }
    .header button:active { transform: scale(0.95); }
    .btn-util {
        background: var(--util-bg);
        color: var(--util-text);
    }
    .btn-op {
        background: var(--op-bg);
        color: var(--op-text);
    }
    .display {
        background: var(--display-bg);
        color: var(--display-text);
        border-radius: 24px;
        padding: 20px;
        font-size: 30px;
        font-weight: 500;
        text-align: right;
        min-height: 90px;
        word-break: break-all;
        line-height: 1.3;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        margin-bottom: 10px;
    }
    .sci-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 6px;
    }
    .sci-row button {
        border: none;
        border-radius: 14px;
        height: 44px;
        background: var(--util-bg);
        color: var(--util-text);
        font-size: 15px;
        font-family: inherit;
        cursor: pointer;
        transition: filter 0.12s ease, transform 0.06s ease;
    }
    .keys {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 8px;
    }
    .keys button {
        border: none;
        border-radius: 20px;
        height: 56px;
        font-size: 20px;
        font-family: inherit;
        cursor: pointer;
        transition: filter 0.12s ease, transform 0.06s ease;
        -webkit-tap-highlight-color: transparent;
    }
    .keys button:hover, .sci-row button:hover, .header button:hover { filter: brightness(0.95); }
    .keys button:active, .sci-row button:active { transform: scale(0.94); }
    .digit { background: var(--digit-bg); color: var(--digit-text); }
    .util { background: var(--util-bg); color: var(--util-text); }
    .op { background: var(--op-bg); color: var(--op-text); }
    .history {
        background: var(--history-bg);
        border-radius: 20px;
        padding: 12px;
        display: none;
    }
    .history.open { display: block; }
    .history-head {
        display: flex;
        align-items: center;
        height: 40px;
        margin-bottom: 6px;
    }
    .history-head h3 {
        margin: 0;
        flex: 1;
        font-size: 18px;
        color: var(--digit-text);
    }
    .history-head button {
        border: none;
        border-radius: 14px;
        height: 36px;
        padding: 0 14px;
        font-size: 13px;
        font-family: inherit;
        background: var(--util-bg);
        color: var(--util-text);
        cursor: pointer;
    }
    .history-list { max-height: 220px; overflow-y: auto; }
    .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        background: var(--surface);
        border-radius: 10px;
        padding: 8px 8px 8px 10px;
        margin-bottom: 4px;
    }
    .row .expr { font-size: 14px; color: var(--digit-text); word-break: break-all; }
    .row .time { font-size: 11px; color: var(--secondary); margin-top: 2px; }
    .row button {
        border: none;
        border-radius: 10px;
        height: 42px;
        padding: 0 12px;
        font-size: 13px;
        font-family: inherit;
        background: var(--util-bg);
        color: var(--util-text);
        cursor: pointer;
        flex-shrink: 0;
    }
    .hint {
        color: var(--secondary);
        font-size: 12px;
        margin-top: 12px;
        text-align: center;
        line-height: 1.5;
    }
</style>
</head>
<body>
<div class="app">
    <div class="header">
        <span class="title">CALCULATOR</span>
        <button class="btn-util" id="theme-btn" onclick="toggleTheme()">Dark</button>
        <button class="btn-op" id="history-btn" onclick="toggleHistory()">History</button>
    </div>

    <div class="display" id="display">0</div>

    <div class="sci-row">
        <button onclick="append('√')">√</button>
        <button onclick="append('²')">x²</button>
        <button onclick="append('^')">x^y</button>
        <button onclick="append('%')">%</button>
    </div>

    <div class="keys">
        <button class="util" onclick="clearAll()">C</button>
        <button class="util" onclick="append('(')">(</button>
        <button class="util" onclick="append(')')">)</button>
        <button class="op" onclick="append('÷')">÷</button>
        <button class="digit" onclick="append('7')">7</button>
        <button class="digit" onclick="append('8')">8</button>
        <button class="digit" onclick="append('9')">9</button>
        <button class="op" onclick="append('×')">×</button>
        <button class="digit" onclick="append('4')">4</button>
        <button class="digit" onclick="append('5')">5</button>
        <button class="digit" onclick="append('6')">6</button>
        <button class="op" onclick="append('-')">-</button>
        <button class="digit" onclick="append('1')">1</button>
        <button class="digit" onclick="append('2')">2</button>
        <button class="digit" onclick="append('3')">3</button>
        <button class="op" onclick="append('+')">+</button>
        <button class="digit" onclick="append('.')">.</button>
        <button class="digit" onclick="append('0')">0</button>
        <button class="util" onclick="backspace()">⌫</button>
        <button class="op" onclick="equals()">=</button>
    </div>

    <div class="history" id="history-panel">
        <div class="history-head">
            <h3>History</h3>
            <button onclick="clearHistory()">Clear</button>
        </div>
        <div class="history-list" id="history-list"></div>
    </div>

    <div class="hint">
        Web demo — every calculation runs through the backend API
        (<code>POST /api/calculate</code>). Keyboard: digits, + - * /, ( ),
        Enter =, Backspace, Esc to clear.
    </div>
</div>
<script>
    let expr = "";
    const display = document.getElementById("display");
    const displayMap = { "÷": "/", "×": "*" };

    function toDisplay(text) {
        return text.replace(/\*/g, "×").replace(/\//g, "÷");
    }

    function refreshDisplay() {
        display.textContent = expr ? toDisplay(expr) : "0";
    }

    function append(ch) {
        expr += displayMap[ch] || ch;
        refreshDisplay();
    }

    function backspace() {
        expr = expr.slice(0, -1);
        refreshDisplay();
    }

    function clearAll() {
        expr = "";
        refreshDisplay();
    }

    function equals() {
        if (!expr) return;
        const sent = expr;
        display.textContent = "…";
        fetch("/api/calculate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ expression: sent })
        })
            .then(r => r.json())
            .then(j => {
                display.textContent = j.success
                    ? toDisplay(j.expression) + " = " + j.result
                    : j.message;
                loadHistory();
            })
            .catch(() => {
                display.textContent = "Request failed";
            });
    }

    function loadHistory() {
        fetch("/api/history")
            .then(r => r.json())
            .then(j => {
                const list = document.getElementById("history-list");
                list.innerHTML = "";
                const rows = j.history || [];
                if (rows.length === 0) {
                    list.innerHTML = '<div class="hint">No history yet</div>';
                    return;
                }
                rows.forEach(item => {
                    const row = document.createElement("div");
                    row.className = "row";
                    const text = document.createElement("div");
                    text.innerHTML =
                        '<div class="expr">' + toDisplay(item.expression) + " = " + item.result + "</div>" +
                        '<div class="time">' + item.created_at + "</div>";
                    const btn = document.createElement("button");
                    btn.textContent = "Delete";
                    btn.onclick = () => deleteOne(item.id);
                    row.appendChild(text);
                    row.appendChild(btn);
                    list.appendChild(row);
                });
            });
    }

    function deleteOne(id) {
        fetch("/api/history/" + id, { method: "DELETE" }).then(loadHistory);
    }

    function clearHistory() {
        if (confirm("Delete all history records?")) {
            fetch("/api/history", { method: "DELETE" }).then(loadHistory);
        }
    }

    function toggleHistory() {
        const panel = document.getElementById("history-panel");
        const open = panel.classList.toggle("open");
        if (open) loadHistory();
    }

    function toggleTheme() {
        const dark = document.documentElement.getAttribute("data-theme") !== "dark";
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "");
        document.getElementById("theme-btn").textContent = dark ? "Light" : "Dark";
        try {
            localStorage.setItem("theme", dark ? "dark" : "light");
        } catch (e) { /* ignore */ }
    }

    (function restoreTheme() {
        let saved = null;
        try { saved = localStorage.getItem("theme"); } catch (e) { /* ignore */ }
        if (saved === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            document.getElementById("theme-btn").textContent = "Light";
        }
    })();

    document.addEventListener("keydown", e => {
        const k = e.key;
        if (k >= "0" && k <= "9") append(k);
        else if (k === ".") append(".");
        else if (k === "+") append("+");
        else if (k === "-") append("-");
        else if (k === "*") append("×");
        else if (k === "/") { e.preventDefault(); append("÷"); }
        else if (k === "(") append("(");
        else if (k === ")") append(")");
        else if (k === "%") append("%");
        else if (k === "^") append("^");
        else if (k === "Enter" || k === "=") { e.preventDefault(); equals(); }
        else if (k === "Backspace") backspace();
        else if (k === "Escape" || k.toLowerCase() === "c") clearAll();
    });

    loadHistory();
</script>
</body>
</html>
