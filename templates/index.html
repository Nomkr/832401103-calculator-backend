<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator — Web Demo</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: linear-gradient(160deg, #e8edf7 0%, #f5f7fb 60%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 28px 16px;
        margin: 0;
    }
    .card {
        width: 380px;
        max-width: 100%;
        background: #ffffff;
        border-radius: 24px;
        box-shadow: 0 10px 40px rgba(23, 38, 61, 0.10);
        padding: 20px;
    }
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
    }
    header .title {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #2f6bff;
        text-transform: uppercase;
    }
    header .subtitle {
        font-size: 12px;
        color: #64748b;
    }
    .display {
        background: #17263d;
        color: #f8fafc;
        border-radius: 16px;
        padding: 18px 16px;
        font-size: 30px;
        font-weight: 500;
        text-align: right;
        min-height: 72px;
        word-break: break-all;
        line-height: 1.3;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        margin-bottom: 14px;
    }
    .keys {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
    }
    button {
        border: none;
        border-radius: 14px;
        padding: 15px 0;
        font-size: 19px;
        font-family: inherit;
        cursor: pointer;
        transition: transform 0.06s ease, filter 0.12s ease;
        -webkit-tap-highlight-color: transparent;
    }
    button:hover { filter: brightness(0.96); }
    button:active { transform: scale(0.94); }
    .digit { background: #f2f5fa; color: #17263d; }
    .util { background: #e6ecf5; color: #42526b; }
    .op { background: #2f6bff; color: #fff; font-size: 21px; }
    .sci { background: #eef2fa; color: #42526b; font-size: 15px; }
    .history {
        margin-top: 16px;
        background: #f7f9fd;
        border-radius: 16px;
        padding: 12px;
    }
    .history-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }
    .history-head h3 { margin: 0; font-size: 14px; color: #17263d; }
    .history-head button {
        padding: 5px 14px;
        font-size: 12px;
        background: #e6ecf5;
        color: #42526b;
    }
    .history-list { max-height: 210px; overflow-y: auto; }
    .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        background: #fff;
        border-radius: 12px;
        padding: 8px 12px;
        margin-bottom: 6px;
        box-shadow: 0 1px 4px rgba(23, 38, 61, 0.05);
    }
    .row .expr { font-size: 14px; color: #17263d; word-break: break-all; }
    .row .time { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .row button { padding: 4px 12px; font-size: 12px; background: #eef2fa; color: #64748b; }
    .hint {
        color: #94a3b8;
        font-size: 12px;
        margin-top: 12px;
        text-align: center;
        line-height: 1.5;
    }
    .hint code {
        background: #eef2fa;
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 11px;
    }
</style>
</head>
<body>
<div class="card">
    <header>
        <span class="title">Calculator</span>
        <span class="subtitle">Web Demo</span>
    </header>

    <div class="display" id="display">0</div>

    <div class="keys">
        <button class="sci" onclick="append('√')">√</button>
        <button class="sci" onclick="append('²')">x²</button>
        <button class="sci" onclick="append('^')">x^y</button>
        <button class="sci" onclick="append('%')">%</button>
        <button class="util" onclick="clearAll()">C</button>
        <button class="util" onclick="append('(')">(</button>
        <button class="util" onclick="append(')')">)</button>
        <button class="op" onclick="append('÷')">÷</button>
        <button class="digit" onclick="append('7')">7</button>
        <button class="digit" onclick="append('8')">8</button>
        <button class="digit" onclick="append('9')">9</button>
        <button class="op" onclick="append('×')">×</button>
        <button class="digit" onclick="append('4')">4</button>
        <button class="digit" onclick="append('5')">5</button>
        <button class="digit" onclick="append('6')">6</button>
        <button class="op" onclick="append('-')">-</button>
        <button class="digit" onclick="append('1')">1</button>
        <button class="digit" onclick="append('2')">2</button>
        <button class="digit" onclick="append('3')">3</button>
        <button class="op" onclick="append('+')">+</button>
        <button class="digit" onclick="append('.')">.</button>
        <button class="digit" onclick="append('0')">0</button>
        <button class="util" onclick="backspace()">⌫</button>
        <button class="op" onclick="equals()">=</button>
    </div>

    <div class="history">
        <div class="history-head">
            <h3>History</h3>
            <button onclick="clearHistory()">Clear all</button>
        </div>
        <div class="history-list" id="history-list"></div>
    </div>

    <div class="hint">
        Web demo page — every calculation is performed by the backend API
        (<code>POST /api/calculate</code>). Keyboard: digits, + - * /, ( ),
        Enter =, Backspace, Esc to clear.
    </div>
</div>
<script>
    let expr = "";
    const display = document.getElementById("display");
    const displayMap = { "÷": "/", "×": "*" };

    function toDisplay(text) {
        return text.replace(/\*/g, "×").replace(/\//g, "÷");
    }

    function refreshDisplay() {
        display.textContent = expr ? toDisplay(expr) : "0";
    }

    function append(ch) {
        expr += displayMap[ch] || ch;
        refreshDisplay();
    }

    function backspace() {
        expr = expr.slice(0, -1);
        refreshDisplay();
    }

    function clearAll() {
        expr = "";
        refreshDisplay();
    }

    function equals() {
        if (!expr) return;
        const sent = expr;
        display.textContent = "…";
        fetch("/api/calculate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ expression: sent })
        })
            .then(r => r.json())
            .then(j => {
                display.textContent = j.success
                    ? toDisplay(j.expression) + " = " + j.result
                    : j.message;
                loadHistory();
            })
            .catch(() => {
                display.textContent = "Request failed";
            });
    }

    function loadHistory() {
        fetch("/api/history")
            .then(r => r.json())
            .then(j => {
                const list = document.getElementById("history-list");
                list.innerHTML = "";
                const rows = j.history || [];
                if (rows.length === 0) {
                    list.innerHTML = '<div class="hint">No history yet</div>';
                    return;
                }
                rows.forEach(item => {
                    const row = document.createElement("div");
                    row.className = "row";
                    const text = document.createElement("div");
                    text.innerHTML =
                        '<div class="expr">' + toDisplay(item.expression) + " = " + item.result + "</div>" +
                        '<div class="time">' + item.created_at + "</div>";
                    const btn = document.createElement("button");
                    btn.textContent = "Delete";
                    btn.onclick = () => deleteOne(item.id);
                    row.appendChild(text);
                    row.appendChild(btn);
                    list.appendChild(row);
                });
            });
    }

    function deleteOne(id) {
        fetch("/api/history/" + id, { method: "DELETE" }).then(loadHistory);
    }

    function clearHistory() {
        if (confirm("Delete all history records?")) {
            fetch("/api/history", { method: "DELETE" }).then(loadHistory);
        }
    }

    document.addEventListener("keydown", e => {
        const k = e.key;
        if (k >= "0" && k <= "9") append(k);
        else if (k === ".") append(".");
        else if (k === "+") append("+");
        else if (k === "-") append("-");
        else if (k === "*") append("×");
        else if (k === "/") { e.preventDefault(); append("÷"); }
        else if (k === "(") append("(");
        else if (k === ")") append(")");
        else if (k === "%") append("%");
        else if (k === "^") append("^");
        else if (k === "Enter" || k === "=") { e.preventDefault(); equals(); }
        else if (k === "Backspace") backspace();
        else if (k === "Escape" || k.toLowerCase() === "c") clearAll();
    });

    loadHistory();
</script>
</body>
</html>
